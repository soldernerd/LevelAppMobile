name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git rev-list --count

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # ── Release steps (push to main only) ────────────────────────────────
      # Version: <major>.<minor>.<commit-count>  e.g. v0.1.47
      # major.minor are read from pubspec.yaml so bumping the version there
      # automatically flows into the tag and the APK — no manual edits needed.
      # --build-name embeds the version in the APK so PackageInfo returns it,
      # which allows the self-update check to compare correctly.

      - name: Compute version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ver
        run: |
          COUNT=$(git rev-list --count HEAD)
          # Extract major.minor from pubspec.yaml version line (e.g. "0.1.0+1" → "0.1")
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/\([0-9]*\.[0-9]*\)\..*/\1/')
          echo "name=${BASE}.${COUNT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}.${COUNT}"  >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            > android/key.properties

      # github flavor = the sideload APK with the in-app self-updater. The
      # built file is app-github-release.apk; rename it back to app-release.apk
      # so already-installed apps (which look for that exact asset name) keep
      # self-updating.
      - name: Build github release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          flutter build apk --release --flavor github \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="$(git rev-list --count HEAD)"
          mv build/app/outputs/flutter-apk/app-github-release.apk \
             build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk

      # play flavor = Google Play build (no self-updater, no INTERNET /
      # REQUEST_INSTALL_PACKAGES). Produces a signed AAB for the Play Console.
      - name: Build Play release bundle (AAB)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          flutter build appbundle --release --flavor play \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="$(git rev-list --count HEAD)"

      - name: Upload Play AAB artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: play-release-aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      # Once a Play service account JSON is stored as the PLAY_SERVICE_ACCOUNT_JSON
      # secret, replace the artifact upload above with a direct publish:
      #
      # - name: Publish to Google Play (internal track)
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.soldernerd.inclinometer
      #     releaseFiles: build/app/outputs/bundle/playRelease/app-play-release.aab
      #     track: internal
      #     status: completed
